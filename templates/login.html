{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<section class="narrow">
  <h1>Sign in</h1>
  <p class="lede">Demo accounts are in the project README.</p>
  {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label><span>Email</span><input type="email" name="email" value="{{ email }}" required></label>
    <label><span>Password</span><input type="password" name="password" required></label>
    <button type="submit">Sign in</button>
  </form>
  <p class="lede">No account? <a href="{{ url_for('register') }}">Create one with a .edu email</a>.</p>
</section>
{% endblock %}
